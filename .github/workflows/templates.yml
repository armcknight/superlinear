name: templates

# templates/ is the content of the armcknight/templates repository, kept here
# until that repository exists. This runs its checks, against this
# repository's docs/anchors.md, and checks the links between the two offline:
# links to armcknight/templates do not resolve until it is published.

on:
  push:
    branches: [main]
    paths: ["templates/**", "docs/**", ".github/workflows/templates.yml"]
  pull_request:
    paths: ["templates/**", "docs/**", ".github/workflows/templates.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r templates/scripts/requirements.txt

      - name: Validate the manifests
        run: python3 templates/scripts/validate.py --anchors docs/anchors.md

      - name: Test the validator
        working-directory: templates
        run: python3 -m unittest discover -s scripts

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments './templates/**/*.md' './docs/**/*.md'
          fail: true
