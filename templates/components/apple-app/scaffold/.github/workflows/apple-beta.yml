name: beta

on:
  # Uncomment the schedule when a manual run has put a build in TestFlight.
  # schedule:
  #   - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  # The beta lane pushes a tag for each uploaded build.
  contents: write

jobs:
  beta:
    uses: armcknight/templates/.github/workflows/apple-beta.yml@{{templates.tag}}
    with:
      platform: {{inputs.platform}}
      xcodegen: {{inputs.xcodegen}}
      force: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
