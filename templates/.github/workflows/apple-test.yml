name: apple-test

# Runs the apple-app component's test lane. A project calls it on each pull
# request, at a tag of this repository:
#
#   jobs:
#     test:
#       uses: armcknight/templates/.github/workflows/apple-test.yml@v1
#       with:
#         platform: ios

on:
  workflow_call:
    inputs:
      platform:
        description: "The fastlane platform: ios, tvos or mac."
        type: string
        default: ios
      xcodegen:
        description: "Generate the Xcode project from project.yml first."
        type: boolean
        default: false
      xcode-version:
        description: "The Xcode to select, such as 16.4 or latest-stable. Empty keeps the runner's default."
        type: string
        default: ""
      runs-on:
        type: string
        default: macos-15
      timeout-minutes:
        type: number
        default: 60

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - if: inputs.xcode-version != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install the Brewfile
        run: if [ -f Brewfile ]; then brew bundle; fi

      - if: inputs.xcodegen
        name: Generate the Xcode project
        run: xcodegen

      - name: Test
        run: bundle exec fastlane "$PLATFORM" test
        env:
          PLATFORM: ${{ inputs.platform }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.platform }}
          path: |
            fastlane/test_output/
          if-no-files-found: ignore
