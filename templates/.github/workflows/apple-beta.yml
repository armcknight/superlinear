name: apple-beta

# Runs the apple-app component's beta lane: builds the app with the next build
# number and uploads it to TestFlight. A project calls it nightly and by hand,
# at a tag of this repository:
#
#   on:
#     schedule:
#       - cron: "0 9 * * *"
#     workflow_dispatch:
#   permissions:
#     contents: write
#   jobs:
#     beta:
#       uses: armcknight/templates/.github/workflows/apple-beta.yml@v1
#       with:
#         platform: ios
#         force: ${{ github.event_name == 'workflow_dispatch' }}
#       secrets: inherit
#
# The beta lane tags each uploaded build beta/<platform>/<build number>. A run
# whose commit already has such a tag skips the upload, so the nightly run
# uploads only when the default branch changed after the last build. A manual
# run sets `force` and always uploads.

on:
  workflow_call:
    inputs:
      platform:
        description: "The fastlane platform: ios, tvos or mac."
        type: string
        default: ios
      force:
        description: "Upload even when this commit already has a build."
        type: boolean
        default: false
      xcodegen:
        description: "Generate the Xcode project from project.yml first."
        type: boolean
        default: false
      xcode-version:
        description: "The Xcode to select, such as 16.4 or latest-stable. Empty keeps the runner's default."
        type: string
        default: ""
      runs-on:
        type: string
        default: macos-15
      timeout-minutes:
        type: number
        default: 60
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_KEY_P8_BASE64:
        required: true
      MATCH_PASSWORD:
        required: true
      MATCH_DEPLOY_KEY:
        required: true

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      upload: ${{ steps.check.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Look for a build of this commit
        env:
          FORCE: ${{ inputs.force }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          tags="$(git tag --points-at HEAD --list "beta/$PLATFORM/*")"
          if [ "$FORCE" = true ]; then
            echo "Forced; uploading."
            echo "upload=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$tags" ]; then
            echo "This commit was already uploaded as $tags; skipping."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "No build of this commit yet; uploading."
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

  beta:
    needs: changed
    if: needs.changed.outputs.upload == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The beta lane reads the history since the last build's tag.
          fetch-depth: 0
          submodules: recursive

      - if: inputs.xcode-version != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install the Brewfile
        run: if [ -f Brewfile ]; then brew bundle; fi

      - if: inputs.xcodegen
        name: Generate the Xcode project
        run: xcodegen

      - name: Load the match deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build and upload to TestFlight
        run: bundle exec fastlane "$PLATFORM" beta
        env:
          PLATFORM: ${{ inputs.platform }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
